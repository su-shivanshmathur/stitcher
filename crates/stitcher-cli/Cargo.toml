[package]
name = "stitcher-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "stitcher"
path = "src/main.rs"

[features]
# NOTE: dropping a backend (e.g. --no-default-features --features transform,cql) does
# NOT compile yet — build_store is only defined for cfg(all(rocks, cql)) and pipeline
# calls it unconditionally. These passthroughs are forward plumbing; default stays all-on.
default   = ["transform", "cql", "rocks"]
transform = ["dep:transformer"]
cql       = ["stitcher/cql"]
rocks     = ["stitcher/rocks"]

[dependencies]
stitcher = { path = "../stitcher", default-features = false }
transformer = { path = "../transformer", optional = true }

tokio.workspace = true
error-stack.workspace = true
tracing.workspace = true

[lints]
workspace = true
