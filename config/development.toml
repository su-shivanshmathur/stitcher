# Development defaults. Override per-deployment via --config-path or STITCHER__* env.

[server]
host = "0.0.0.0"
port = 9090

[log]
# directive syntax: deps (rdkafka/scylla/actix) at info, the framework's debug
# logs (consumed keys, filter reasons, cql statements, commits) on; RUST_LOG wins
level = "info,stitcher=debug"

[source_kafka]
brokers = ["localhost:9092"]
topics = ["consolidated-events"]
consumer_group = "stitcher"
# where a group without committed offsets starts: earliest | latest
auto_offset_reset = "earliest"
# librdkafka stats interval (consumer-lag gauges), ms; 0 disables
statistics_interval_ms = 10000
extra = { "queued.max.messages.kbytes" = "16384", "partition.assignment.strategy" = "cooperative-sticky" }

[sink_kafka]
brokers = ["localhost:9092"]
dlq_topic = "stitcher-dlq"
extra = { }

[batch]
count = 100000
window_ms = 1

[store]
backend = "cql"

[store.cql]
hosts = ["localhost"]
port = 9042
keyspace = "stitcher"
table = "state"

[store.rocksdb]
path = "/tmp/stitcher-rocksdb"
ttl_secs = 0

# The generic `stitcher` binary's state machine (ignored by domain binaries).
[state]
config_file = "config/intent.yaml"

[enrichment]
config_file = ""
reload_secs = 43200

[filters.intent]
topic = "stitcher-intent-events"
retention_days = 182
retention_key = "created_at"

[filters.attempt]
topic = "stitcher-attempt-events"
retention_days = 182
retention_key = "created_at"

[filters.refund]
topic = "stitcher-refund-events"
retention_days = 182
retention_key = "created_at"

[filters.dispute]
topic = "stitcher-dispute-events"
retention_days = 182
retention_key = "created_at"

tenant_ids = ["public"]
